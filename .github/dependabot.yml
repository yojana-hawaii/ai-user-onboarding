version: 2
updates:
  - package-ecosystem: npm
    directory: /src/dahub-web
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /.docker/backend
      - /.docker/frontend
      - /.docker/scanner
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly


  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
